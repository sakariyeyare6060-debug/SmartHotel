<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07102a"/>
      <stop offset=".55" stop-color="#1a2c5c"/>
      <stop offset="1" stop-color="#3b3f6e"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2a4d"/>
      <stop offset="1" stop-color="#121c36"/>
    </linearGradient>
    <linearGradient id="lobby" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd48a"/>
      <stop offset="1" stop-color="#f59e42"/>
    </linearGradient>
    <radialGradient id="glowGround" cx=".5" cy="1" r=".6">
      <stop offset="0" stop-color="#ffb35c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="win" width="54" height="64" patternUnits="userSpaceOnUse">
      <rect x="8" y="10" width="36" height="44" rx="2" fill="#ffc772"/>
      <rect x="8" y="10" width="36" height="6" fill="#ffe2a8"/>
    </pattern>
    <pattern id="winSide" width="46" height="60" patternUnits="userSpaceOnUse">
      <rect x="8" y="10" width="28" height="38" rx="2" fill="#e9a95a" opacity=".85"/>
    </pattern>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="1000" fill="url(#sky)"/>
  <g fill="#fff" opacity=".8">
    <circle cx="80" cy="90" r="1.6"/><circle cx="170" cy="40" r="1.2"/><circle cx="260" cy="130" r="1.4"/>
    <circle cx="420" cy="60" r="1.1"/><circle cx="560" cy="110" r="1.5"/><circle cx="700" cy="50" r="1.3"/>
    <circle cx="820" cy="140" r="1.6"/><circle cx="130" cy="210" r="1"/><circle cx="760" cy="230" r="1.1"/>
    <circle cx="610" cy="200" r="1"/><circle cx="330" cy="220" r="1.2"/>
  </g>
  <circle cx="760" cy="120" r="34" fill="#f5f0dc" opacity=".9"/>
  <circle cx="774" cy="110" r="32" fill="#1a2a58" opacity=".55"/>

  <!-- side wings -->
  <rect x="60" y="520" width="200" height="480" fill="#101a33"/>
  <rect x="80" y="545" width="165" height="400" fill="url(#winSide)"/>
  <rect x="640" y="560" width="220" height="440" fill="#101a33"/>
  <rect x="660" y="585" width="185" height="360" fill="url(#winSide)"/>

  <!-- main tower -->
  <rect x="230" y="235" width="440" height="765" fill="url(#tower)"/>
  <rect x="230" y="235" width="440" height="14" fill="#2a3b66"/>
  <rect x="258" y="330" width="384" height="520" fill="url(#win)"/>
  <!-- a few dark rooms -->
  <g fill="#1a2748">
    <rect x="320" y="340" width="36" height="44"/><rect x="482" y="404" width="36" height="44"/>
    <rect x="266" y="532" width="36" height="44"/><rect x="590" y="596" width="36" height="44"/>
    <rect x="428" y="660" width="36" height="44"/><rect x="374" y="788" width="36" height="44"/>
    <rect x="536" y="468" width="36" height="44"/>
  </g>
  <!-- vertical fins -->
  <g fill="#0f1830">
    <rect x="308" y="320" width="4" height="540"/><rect x="416" y="320" width="4" height="540"/>
    <rect x="524" y="320" width="4" height="540"/><rect x="632" y="320" width="4" height="540"/>
  </g>

  <!-- neon sign -->
  <text x="450" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56"
        font-weight="700" letter-spacing="6" fill="#ff9d45" filter="url(#neon)">SMART HOTEL</text>

  <!-- lobby -->
  <rect x="300" y="870" width="300" height="130" fill="url(#lobby)"/>
  <g fill="#c77a2c" opacity=".6">
    <rect x="345" y="870" width="4" height="130"/><rect x="420" y="870" width="4" height="130"/>
    <rect x="476" y="870" width="4" height="130"/><rect x="551" y="870" width="4" height="130"/>
  </g>
  <rect x="270" y="856" width="360" height="18" rx="3" fill="#0d1428"/>
  <ellipse cx="450" cy="1000" rx="420" ry="120" fill="url(#glowGround)"/>

  <!-- trees -->
  <g fill="#0a1224">
    <ellipse cx="60" cy="930" rx="80" ry="90"/><ellipse cx="170" cy="960" rx="70" ry="70"/>
    <ellipse cx="840" cy="930" rx="85" ry="95"/><ellipse cx="730" cy="965" rx="65" ry="65"/>
    <rect x="0" y="960" width="900" height="40"/>
  </g>
  <g fill="#ffd27a">
    <circle cx="250" cy="940" r="4"/><circle cx="650" cy="940" r="4"/>
  </g>
</svg>
